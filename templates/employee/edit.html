{% extends 'base.html' %}

{% block title %}Edit Employee - HR Portal{% endblock %}

{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
    <h2>Edit Employee Profile</h2>
    <a href="{{ url_for('employee.profile', employee_id=employee.id) }}" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('employee.edit', employee_id=employee.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="grid grid-cols-2">
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" value="{{ employee.first_name }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" value="{{ employee.last_name }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" value="{{ employee.email }}" required>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone</label>
                <input type="tel" id="phone_number" name="phone_number" value="{{ employee.phone_number or '' }}">
            </div>
            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth" value="{{ employee.date_of_birth or '' }}">
            </div>
            <div class="form-group">
                <label for="date_of_joining">Date of Joining</label>
                <input type="date" id="date_of_joining" name="date_of_joining" value="{{ employee.date_of_joining }}">
            </div>
            <div class="form-group">
                <label for="department_id">Department</label>
                <select id="department_id" name="department_id">
                    <option value="">— Select Department —</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}" {% if employee.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="designation_id">Designation</label>
                <select id="designation_id" name="designation_id">
                    <option value="">— Select Designation —</option>
                    {% for des in designations %}
                    <option value="{{ des.id }}" {% if employee.designation_id == des.id %}selected{% endif %}>{{ des.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="manager_id">Reporting Manager</label>
                <select id="manager_id" name="manager_id">
                    <option value="">— No Manager —</option>
                    {% for mgr in managers %}
                    <option value="{{ mgr.id }}" {% if employee.manager_id == mgr.id %}selected{% endif %}>{{ mgr.first_name }} {{ mgr.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('employee.profile', employee_id=employee.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
